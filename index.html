
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GH HUB PREMIUM</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at 15% 20%,#41105e 0,transparent 35%),
 radial-gradient(ellipse at 85% 80%,#281044 0,transparent 40%),
 #050309;
 color:white;
 font-family:Arial,sans-serif;
 padding:12px;
}

.app{
 max-width:1100px;
 margin:15px auto;
 border:1px solid #8736bb;
 border-radius:18px;
 overflow:hidden;
 background:rgba(8,5,15,.94);
 box-shadow:0 0 35px #9c28e855;
}

header{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:15px;
 background:linear-gradient(100deg,#170923,#35104e,#100819);
 border-bottom:1px solid #7731a7;
 flex-wrap:wrap;
}

.logo{
 color:#d58aff;
 font-size:25px;
 font-weight:900;
 font-style:italic;
 text-shadow:0 0 15px #b52dff;
}

.actions{display:flex;gap:7px;flex-wrap:wrap}

button{
 cursor:pointer;
 color:white;
 background:#1d1029;
 border:1px solid #71349c;
 border-radius:9px;
 padding:10px 13px;
 font-weight:bold;
}

button:hover{background:#542078}

.tabs{
 display:flex;
 gap:8px;
 padding:12px;
 border-bottom:1px solid #442052;
}

.tab.active,.filter.active{
 background:#8129bd;
 box-shadow:0 0 12px #a42de7;
}

.content{padding:14px}

h2{
 color:#d58aff;
 font-size:17px;
 margin:5px 0 13px;
}

.filters{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:14px;
}

.filter{min-width:100px}

.table-wrap{
 overflow-x:auto;
 border:1px solid #54256f;
 border-radius:10px;
}

table{
 width:100%;
 min-width:720px;
 border-collapse:collapse;
 font-size:12px;
}

th{
 color:#bd65f0;
 background:#160d20;
 padding:12px 8px;
 text-align:left;
}

td{
 padding:10px 8px;
 border-top:1px solid #281733;
 white-space:nowrap;
}

tr:hover{background:#20112e}

.rarity{
 color:#d58aff;
 font-weight:bold;
}

.join{
 color:#72ffae;
 border-color:#28a66b;
 padding:5px 12px;
}

.join:disabled{
 opacity:.7;
 cursor:not-allowed;
}

.status{
 color:#b9a3c9;
 font-size:12px;
 margin:10px 0;
}

.panel{
 background:#130c1d;
 border:1px solid #54256f;
 border-radius:12px;
 padding:16px;
 margin-top:12px;
}

.hidden{display:none}

footer{
 text-align:center;
 color:#a77ac0;
 padding:16px;
 border-top:1px solid #351b46;
 font-size:12px;
}

@media(max-width:550px){
 body{padding:5px}
 .logo{font-size:21px}
 header{padding:12px}
 button{padding:9px;font-size:11px}
 .content{padding:9px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">♛ GH HUB</div>
 <div class="actions">
  <button onclick="showMessage('Guardado pendiente de conexión.')">SAVE</button>
  <button onclick="showMessage('WEAPONS: apartado visual.')">WEAPONS</button>
  <button onclick="refreshItems()">REFRESH ⟳</button>
 </div>
</header>

<div class="tabs">
 <button class="tab active" id="liveTab"
 onclick="openTab('live')">LIVE ITEMS</button>
 <button class="tab" id="serverTab"
 onclick="openTab('servers')">SERVERS</button>
</div>

<div class="content" id="livePage">
 <h2>✦ LIVE ITEMS</h2>

 <div class="filters">
  <button class="filter active" onclick="filterItems('ALL',this)">ALL</button>
  <button class="filter" onclick="filterItems('OMEGA',this)">★ OMEGA</button>
  <button class="filter" onclick="filterItems('LEGENDARY',this)">★ LEGENDARY</button>
  <button class="filter" onclick="filterItems('EPIC',this)">★ EPIC</button>
 </div>

 <p class="status" id="status">
  DEMO MODE · Datos de ejemplo, conexión real pendiente.
 </p>

 <div class="table-wrap">
 <table>
  <thead>
   <tr>
    <th>WEAPON</th>
    <th>RARITY</th>
    <th>PLR</th>
    <th>AGE</th>
    <th>JOB ID</th>
    <th>JOIN</th>
   </tr>
  </thead>
  <tbody id="items"></tbody>
 </table>
 </div>
</div>

<div class="content hidden" id="serversPage">
 <h2>✦ PUBLIC SERVERS</h2>
 <div class="panel">
  <h3>SERVER BROWSER</h3>
  <p class="status">
   La conexión con los servidores públicos todavía está pendiente.
  </p>
  <p>Jugadores: --</p>
  <p>Espacios disponibles: --</p>
  <button onclick="showMessage('Conexión de servidores pendiente.')">
   REFRESH SERVERS ⟳
  </button>
 </div>
</div>

<footer>
 GH HUB PREMIUM · VERSION 1.1
</footer>

</div>

<script>
const demoItems=[
 {name:"Anaconda",rarity:"OMEGA",players:"19/30",age:"1m 38s",id:"DEMO-001"},
 {name:"Anaconda",rarity:"OMEGA",players:"5/30",age:"3m 49s",id:"DEMO-002"},
 {name:"Remington",rarity:"LEGENDARY",players:"23/30",age:"0s",id:"DEMO-003"},
 {name:"RPG",rarity:"LEGENDARY",players:"20/30",age:"6s",id:"DEMO-004"},
 {name:"MP5",rarity:"LEGENDARY",players:"11/30",age:"7s",id:"DEMO-005"},
 {name:"Tactical Knife",rarity:"LEGENDARY",players:"9/30",age:"7s",id:"DEMO-006"},
 {name:"AK47",rarity:"EPIC",players:"20/30",age:"13s",id:"DEMO-007"},
 {name:"MP5",rarity:"EPIC",players:"7/30",age:"15s",id:"DEMO-008"}
];

function renderItems(filter="ALL"){
 const tbody=document.getElementById("items");
 tbody.innerHTML="";

 demoItems
 .filter(item=>filter==="ALL"||item.rarity===filter)
 .forEach(item=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td>★ ${item.name}</td>
   <td class="rarity">${item.rarity}</td>
   <td>${item.players}</td>
   <td>${item.age}</td>
   <td>${item.id}</td>
   <td><button class="join" disabled>JOIN</button></td>
  `;
  tbody.appendChild(tr);
 });
}

function filterItems(rarity,button){
 document.querySelectorAll(".filter")
 .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 renderItems(rarity);
}

function openTab(tab){
 const live=tab==="live";
 document.getElementById("livePage").classList.toggle("hidden",!live);
 document.getElementById("serversPage").classList.toggle("hidden",live);
 document.getElementById("liveTab").classList.toggle("active",live);
 document.getElementById("serverTab").classList.toggle("active",!live);
}

function showMessage(message){
 document.getElementById("status").textContent=message;
}

function refreshItems(){
 showMessage("Actualización pendiente: todavía no hay conexión de datos reales.");
}

renderItems();
</script>

</body>
</html>
